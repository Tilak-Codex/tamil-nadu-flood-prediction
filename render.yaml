services:
  - type: web
    name: tamil-nadu-flood-prediction
    env: python
    buildCommand: "pip install -r requirements.txt && python scripts/init_database.py"
    startCommand: "uvicorn src.api.app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
